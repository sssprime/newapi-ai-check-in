name: newapi.ai check-in
on:
  schedule:
    # Runs every 8 hours, matching the upstream project.
    - cron: '0 */8 * * *'
  workflow_dispatch:
    inputs:
      accounts:
        description: 'Account config JSON. Optional; uses secrets.ACCOUNTS when empty.'
        required: false
        type: string
        default: ''
      providers:
        description: 'Custom provider config JSON. Optional; uses secrets.PROVIDERS when empty.'
        required: false
        type: string
        default: ''
      debug:
        description: 'Debug mode. Saves screenshots and HTML logs when enabled.'
        required: false
        type: boolean

jobs:
  checkin:
    permissions:
      id-token: write
      contents: read
    runs-on: windows-2025
    environment: production
    env:
      PYTHONIOENCODING: utf-8
    steps:
    - name: Set Beijing timezone
      uses: szenius/set-timezone@v2.0
      with:
        timezoneWindows: "China Standard Time"

    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache uv dependencies
      uses: actions/cache@v4
      id: uv-cache
      with:
        path: |
          ~/.cache/uv
          .venv
        key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml', 'uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: Install dependencies
      if: steps.uv-cache.outputs.cache-hit != 'true'
      run: |
        echo "Cache miss; installing dependencies..."
        uv sync
        echo "Environment initialized"

    - name: Get Camoufox version
      id: camoufox-version
      run: |
        $version = uv run python -c "import importlib.metadata; print(importlib.metadata.version('camoufox'))"
        echo "version=$version" >> $env:GITHUB_OUTPUT
        echo "Camoufox version: $version"

    - name: Cache Camoufox browser
      uses: actions/cache@v4
      id: camoufox-cache
      with:
        path: ~\AppData\Local\camoufox
        key: ${{ runner.os }}-camoufox-${{ steps.camoufox-version.outputs.version }}
        restore-keys: |
          ${{ runner.os }}-camoufox-

    - name: Install Camoufox browser
      if: steps.camoufox-cache.outputs.cache-hit != 'true'
      run: |
        echo "Cache miss; downloading Camoufox browser..."
        uv run camoufox fetch
        echo "Camoufox browser installed"

    - name: Restore login state cache
      uses: actions/cache/restore@v4
      with:
        path: |
          storage-states
        key: storage-state-${{ hashFiles('storage-states/*.json') }}
        restore-keys: |
          storage-state-

    - name: Restore balance history cache
      uses: actions/cache/restore@v4
      with:
        path: |
          balance_hash.txt
        key: balance-hash-${{ hashFiles('balance_hash.txt') }}
        restore-keys: |
          balance-hash-

    - name: Run check-in
      env:
        ACCOUNTS: ${{ inputs.accounts || secrets.ACCOUNTS }}
        ACCOUNTS_LINUX_DO: ${{ secrets.ACCOUNTS_LINUX_DO }}
        ACCOUNTS_GITHUB: ${{ secrets.ACCOUNTS_GITHUB }}
        RUN_LINUXDO_LOGIN_MANUAL: true
        PROVIDERS: ${{ inputs.providers || secrets.PROVIDERS }}
        PROXY: ${{ secrets.PROXY }}
        STORATE_STATES_GITHUB: ${{ secrets.STORATE_STATES_GITHUB }}
        STORATE_STATES_LINUXDO: ${{ secrets.STORATE_STATES_LINUXDO }}
        DEBUG: ${{ github.event_name == 'workflow_dispatch' && inputs.debug || vars.DEBUG || 'false' }}
        DINGDING_WEBHOOK: ${{ secrets.DINGDING_WEBHOOK }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        EMAIL_TO: ${{ secrets.EMAIL_TO }}
        CUSTOM_SMTP_SERVER: ${{ secrets.CUSTOM_SMTP_SERVER }}
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        SERVERPUSHKEY: ${{ secrets.SERVERPUSHKEY }}
        FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        WEIXIN_WEBHOOK: ${{ secrets.WEIXIN_WEBHOOK }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        if (Test-Path "storage-states") {
          echo "storage-states directory: $(Resolve-Path storage-states)"
          Get-ChildItem -Path storage-states -File | Format-Table Name, Length, LastWriteTime -AutoSize
          echo "File count: $((Get-ChildItem -Path storage-states -File).Count)"
        } else {
          echo "storage-states directory does not exist"
        }
        uv run python -u main.py

    - name: Save login state cache
      if: hashFiles('storage-states/*.json') != ''
      uses: actions/cache/save@v4
      with:
        path: |
          storage-states
        key: storage-state-${{ hashFiles('storage-states/*.json') }}

    - name: Save balance history cache
      if: hashFiles('balance_hash.txt') != ''
      uses: actions/cache/save@v4
      with:
        path: |
          balance_hash.txt
        key: balance-hash-${{ hashFiles('balance_hash.txt') }}

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: artifacts-${{ github.run_number }}
        path: |
          logs/
          screenshots/
        if-no-files-found: ignore
        retention-days: 7

    - name: Print result timestamp
      if: always()
      run: |
        echo "Check-in workflow completed"
        echo "Time: $(Get-Date)"
